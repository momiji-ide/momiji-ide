name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild --force --types prod,dev,optional
        env:
          npm_config_msvs_version: '2019'

      - name: Build (vite)
        run: npm run build

      - name: Package & publish (Windows)
        run: npm run dist -- --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild --force --types prod,dev,optional

      - name: Build (vite)
        run: npm run build

      - name: Package & publish (macOS)
        run: npm run dist -- --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 make g++ \
            rpm fakeroot dpkg \
            libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild --force --types prod,dev,optional

      - name: Build (vite)
        run: npm run build

      - name: Package & publish (Linux)
        run: npm run dist -- --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
