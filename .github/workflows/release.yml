name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python setuptools (fixes distutils on Python 3.12+)
        run: pip install setuptools

      - name: Install dependencies (skip native scripts)
        run: npm ci --ignore-scripts

      - name: Try rebuild node-pty (optional — fallback to child_process if fails)
        run: node scripts/patch-node-pty.js && npx electron-rebuild -f -w node-pty
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Package (Windows)
        run: npm run dist -- --win --publish never

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native scripts)
        run: npm ci --ignore-scripts

      - name: Try rebuild node-pty (optional — fallback if fails)
        run: npx electron-rebuild -f -w node-pty
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Package (macOS)
        run: npm run dist -- --mac --publish never

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 python3-setuptools make g++ \
            rpm fakeroot dpkg \
            libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install dependencies (skip native scripts)
        run: npm ci --ignore-scripts

      - name: Try rebuild node-pty (optional — fallback if fails)
        run: npx electron-rebuild -f -w node-pty
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Package (Linux)
        run: npm run dist -- --linux --publish never

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
